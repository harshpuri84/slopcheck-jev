[project]
name = "slopcheck"
version = "0.1.0"
description = "Report which AI tells a passage contains, with the line quoted. Jev-backed."
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["pyyaml>=6.0"]

[project.scripts]
slopcheck = "slopcheck.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["slopcheck"]

[tool.setuptools.package-data]
slopcheck = ["tells.yaml"]
