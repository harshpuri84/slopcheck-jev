# Every tell slopcheck knows. Swap this file to change the domain.
#
# layer: lex  -> regex, free, exact. Jev never sees it.
# layer: jev  -> needs reading. One noul per tell in call 1.
#
# Sources: ~/.claude/skills/unslop/SKILL.md (31 numbered tells)
#          ~/.claude/skills/no-ai-slop/SKILL.md (patterns to cut)

meta:
  model: jev-latest
  url: https://api.typesafe.ai/v1/systemone
  # A noul inside this band means the model is not answering. Suppress it.
  undecided_band: [0.40, 0.60]

lex:
  em_dash:
    kind: pattern
    name: em dash
    unslop: 13
    pattern: '—'
    max: 0
    fix: End the sentence or use a comma.
  en_dash_sub:
    kind: pattern
    name: en dash used as a dash
    unslop: 13
    pattern: ' – '
    max: 0
    fix: End the sentence or use a comma.
  curly_quote:
    kind: pattern
    name: curly quote
    unslop: 19
    pattern: '[‘’“”]'
    max: 0
    fix: Use straight quotes.
  decorative_emoji:
    kind: pattern
    name: decorative emoji
    unslop: 18
    pattern: '[\U0001F300-\U0001FAFF✀-➿☀-⛿]'
    max: 0
    fix: Remove it.
  inline_header_list:
    kind: pattern
    name: inline-header list
    unslop: 16
    # Bold label + colon that restates the line. A bold lead-in ending in a
    # period is explicitly fine per unslop 16, so the colon is the test.
    pattern: '^\s*[-*]\s+\*\*[^*]{2,40}(?::\*\*|\*\*\s*:)'
    max: 0
    fix: Convert to prose, or end the bold lead-in with a period and add new detail.
  title_case_heading:
    kind: pattern
    name: title case heading
    unslop: 17
    pattern: '^#{1,6}\s+(?:[A-Z][a-z]*\s+){2,}[A-Z][a-z]*\s*$'
    max: 0
    fix: Sentence case.
  banned_word:
    kind: words
    name: AI vocabulary
    unslop: 7
    fix: Use the plain word.
    # Union of unslop 7/26/31 and no-ai-slop "banned outright". Word-boundary matched.
    words:
      - delve
      - foster
      - fostering
      - leverage
      - leveraging
      - utilize
      - utilise
      - facilitate
      - empower
      - streamline
      - robust
      - cutting-edge
      - paradigm
      - paradigm shift
      - game changer
      - game-changer
      - tapestry
      - realm
      - beacon
      - multifaceted
      - meticulous
      - meticulously
      - intricate
      - paramount
      - transformative
      - elevate
      - embark
      - supercharge
      - ever-evolving
      - testament
      - pivotal
      - underscore
      - underscores
      - underscoring
      - showcase
      - showcases
      - showcasing
      - garner
      - interplay

  promotional:
    kind: words
    name: promotional language
    unslop: 4
    fix: Use a neutral description.
    words: [nestled, vibrant, breathtaking, groundbreaking, renowned, stunning,
            must-visit, iconic, world-class, unparalleled, seamless, effortless,
            best-in-class, industry-leading, state-of-the-art, bustling, picturesque,
            hidden gem, game-changing]

  empty_adverb:
    kind: words
    name: often-empty adverb
    unslop: 30
    fix: Cut it, or use the number or a stronger verb.
    # no-ai-slop's "often-empty adverbs" list. These are flagged, not banned:
    # they are fine when they carry emphasis, contrast or spoken rhythm.
    words: [significantly, dramatically, incredibly, extremely, highly, deeply,
            truly, literally, fundamentally, inherently, inevitably, crucially,
            importantly, vastly, remarkably, notably, considerably, substantially]

  abstract_metaphor:
    kind: words
    name: abstract metaphor noun
    unslop: 26
    fix: Pick the concrete word. "substrate" is "base", "wedge" is "add", "vector" is "way".
    words: [substrate, wedge, locus, vantage, nexus, bedrock, scaffolding, modality,
            paradigm, gold-plating, ratchet, endgame, north star, flywheel, primitive,
            surface area, api surface, lever, levers, moat, moats, unlock,
            unlocks, step-change, wedges, primitives]

  plain_word:
    kind: words
    name: fancier word than needed
    unslop: 31
    fix: Use the plain word.
    words: [numerous, myriad, plethora, commence, endeavour, endeavor, ascertain,
            subsequently, prior to, aforementioned, heretofore, furthermore, moreover,
            nevertheless, notwithstanding, henceforth, whilst, amongst, additionally]

  chatbot_phrase:
    kind: phrases
    name: chatbot phrase
    unslop: 20
    fix: Remove it.
    phrases: ["i hope this helps", "let me know if", "feel free to", "happy to help",
              "of course!", "certainly!", "absolutely!",
              "i'd be happy to", "hope that helps", "let me know how", "does that help"]

  sycophancy:
    kind: phrases
    name: sycophantic opener
    unslop: 22
    fix: Respond directly.
    phrases: ["great question", "you're absolutely right", "you are absolutely right",
              "that's a great point", "excellent point", "you're right to", "good catch",
              "what a great", "i love this question"]

  cutoff_disclaimer:
    kind: phrases
    name: cutoff disclaimer
    unslop: 21
    fix: Find the source, or cut the claim.
    phrases: ["while specific details are limited", "as of my last update",
              "my training data", "i don't have access to real-time",
              "details are scarce", "information is limited", "publicly available information"]

  filler_phrase:
    kind: phrases
    name: filler phrase
    unslop: 23
    fix: Delete it, or use the short form.
    phrases: ["in order to", "due to the fact that", "it is important to note",
              "it's important to note", "it is worth noting", "it's worth noting",
              "at the end of the day", "when it comes to", "at its core",
              "in today's world", "in the age of", "the reality is", "the truth is",
              "in terms of", "with regard to", "going forward", "in this article",
              "let's dive in", "needless to say", "for all intents and purposes"]

  hedge_stack:
    kind: pattern
    name: stacked hedging
    unslop: 24
    # Two hedges inside six words. One hedge is fine; three in a row is not.
    pattern: '(?i)\b(?:could|might|may|possibly|potentially|perhaps|arguably|somewhat|fairly|rather|seemingly|appears? to|tends? to|relatively)\b(?:\W+\w+){0,4}\W+\b(?:could|might|may|possibly|potentially|perhaps|arguably|somewhat|fairly|rather|seemingly|be argued|tends? to|relatively)\b'
    max: 0
    fix: Keep one hedge, or state the claim.

  bold_density:
    kind: density
    name: boldface overuse
    unslop: 15
    pattern: '\*\*[^*\n]{1,80}\*\*'
    # More than one bold run per 40 words reads as decoration, not emphasis.
    per_words: 40
    fix: Bold the few things a skimmer must not miss. Unbold the rest.

  long_sentence:
    kind: length
    name: dense sentence
    unslop: 28
    max_words: 38
    fix: Split it. One idea per sentence.

# Fifteen judgments. Each becomes one noul in call 1, and one choice in call 2
# if it fires. instructions/criteria go to the model verbatim; the id does not.
jev:
  binary_contrast:
    name: binary contrast
    unslop: 9
    threshold: 0.70
    instructions: >
      The passage contains a sentence built as a negated contrast, where the writer
      denies one framing in order to assert another. Forms include "not just X, but Y",
      "it is not X, it is Y", "the question is not X, it is Y", and "X is not the
      problem. Y is."
    criteria:
      true: A sentence denies one framing in order to assert a second one.
      false: >
        Every claim is stated directly. A plain negation of a fact, such as "the
        run did not finish", is not this pattern.
    fix: State the second half directly and delete the first.

  fake_profound_kicker:
    name: fake-profound kicker
    unslop: null
    threshold: 0.70
    instructions: >
      The final line of the passage is an aphorism, metaphor or mic-drop rather than a
      concrete point. It restates the passage as something quotable instead of ending on
      a fact, an instruction or a next action.
    criteria:
      true: The last line is a quotable abstraction, a rhetorical question, or a cute metaphor.
      false: The last line states a fact, a number, an instruction, or what happens next.
    fix: Delete it. End on the clearest concrete sentence already present.

  summary_recap_ending:
    name: summary-recap ending
    unslop: 25
    threshold: 0.70
    instructions: >
      The passage closes by summing itself up instead of ending on its last concrete
      point. A closing that opens with "in conclusion", "ultimately", "overall", "to sum
      up", "at the end of the day" or "all in all" is this pattern, because the reader
      has just read the passage and does not need it restated. It is still this pattern
      when the summarising sentence also states an opinion.
    criteria:
      true: >
        The closing summarises, generalises or moralises about what came before, with or
        without a summary marker word. Example: "In conclusion, retries are a design
        decision, not an accident."
      false: >
        The passage ends on a specific fact, a number, a next action, or an instruction,
        with no summarising move.
    fix: Cut it. End on the last concrete point.

  throat_clearing:
    name: throat-clearing opener
    unslop: 23
    threshold: 0.70
    instructions: >
      A sentence delays the point with a stock preamble instead of stating it. Forms
      include "here is the thing", "let me be clear", "I'll be honest", "the
      uncomfortable truth is", "it is worth noting that", "it is important to note that".
    criteria:
      true: A sentence announces that a point is coming instead of making it.
      false: >
        Every sentence carries content. A personal aside that supplies real context,
        tension or character is not throat-clearing.
    fix: Delete the preamble and state the point.

  faux_insight:
    name: faux-insight setup
    unslop: null
    threshold: 0.70
    instructions: >
      A sentence flatters the writer as the lone expert before making a claim. Forms
      include "what most people get wrong", "here is what nobody tells you", "this is
      the part everyone misses", "most teams never do this".
    criteria:
      true: A claim is introduced by asserting that others fail to see it.
      false: Claims stand on their own without a preamble about what others miss.
    fix: Cut the setup. Let the claim stand alone.

  colon_reveal:
    name: colon reveal
    unslop: 14
    threshold: 0.70
    instructions: >
      A noun phrase, then a colon, then a dramatic lowercase reveal, used for effect
      rather than to introduce a list, a label or a quote. For example "the detail that
      makes it work: a separate agent grades it".
    criteria:
      true: A colon is used mid-sentence for drama rather than to introduce a list or label.
      false: >
        Colons appear only before lists, labels, quotes or code, or do not appear
        at all.
    fix: Rewrite as a plain sentence.

  superficial_ing:
    name: superficial -ing clause
    unslop: 3
    threshold: 0.70
    instructions: >
      A trailing clause beginning with a participle claims to explain the significance
      of what was just stated, without adding a fact. Markers include "highlighting",
      "underscoring", "reflecting", "showcasing", "demonstrating", "ensuring",
      "cementing", "solidifying".
    criteria:
      true: A trailing participle clause asserts significance instead of adding a fact.
      false: >
        Trailing clauses add a concrete consequence, mechanism or number, or there
        are none.
    fix: Replace it with the concrete consequence, or delete it.

  importance_puffery:
    name: importance puffery
    unslop: 1
    threshold: 0.70
    instructions: >
      A sentence asserts that something matters rather than stating the fact and letting
      the reader judge. Forms include "stands as a testament to", "marks a pivotal
      moment", "plays a vital role", "solidifies its position", "represents a major step".
    criteria:
      true: Significance is asserted rather than shown.
      false: Facts are stated plainly and the reader is left to judge their weight.
    fix: State the fact. Delete the claim about its importance.

  weasel_attribution:
    name: weasel attribution
    unslop: 5
    threshold: 0.70
    instructions: >
      A claim is attributed to an unnamed authority. Forms include "experts agree",
      "studies show", "industry reports suggest", "many argue", "it is widely regarded as",
      "research indicates".
    criteria:
      true: A claim is sourced to an unnamed group or body of work.
      false: Sources are named, or claims are made in the writer's own voice.
    fix: Name the source or cut the claim.

  fake_strong_verb:
    name: fake-strong verb
    unslop: 8
    threshold: 0.70
    instructions: >
      An inflated verb stands in for "is" or "has". Forms include "serves as", "stands as",
      "boasts", "features", "represents", "constitutes", "acts as a", "functions as".
    criteria:
      true: An inflated verb phrase replaces a plain "is" or "has".
      false: Plain verbs are used, or the verb carries real meaning the plain word would lose.
    fix: Use "is" or "has".

  forced_triad:
    name: forced rule of three
    unslop: 10
    threshold: 0.70
    instructions: >
      The passage contains a list of exactly three items where the three are not peers.
      Test each list of three: is one item vaguer than the others, is one a consequence
      of the other two rather than a sibling of them, or does one repeat another in
      different words? Any of those means the list was padded to three for rhythm.
    criteria:
      true: >
        A three-item list exists and at least one item is vaguer than its neighbours, is
        an outcome rather than a peer, or restates another item. Example: "fewer panels,
        clearer names, and better outcomes" pads with an outcome.
      false: >
        Every three-item list has three concrete, distinct, same-kind items, or the
        passage contains no list of three.
    fix: Use the natural number.

  feeling_not_mechanism:
    name: feeling instead of mechanism
    unslop: 27
    threshold: 0.70
    instructions: >
      A sentence names how something feels, or a quality it has, where a mechanism, a
      number or a concrete instruction belongs. The test: could this sentence appear
      unchanged in another project's documentation? Examples of the pattern are "the
      database stays close at hand", "types that follow your schema", "SQL you can read".
    criteria:
      true: >
        At least one sentence names a feeling or an unmeasured quality where a
        mechanism, number or instruction would say more.
      false: >
        Claims name a mechanism, a number, a named component, or something the reader
        can do or check.
    fix: Name the mechanism or the number. If neither exists, cut the sentence.

  hidden_actor_passive:
    name: passive with hidden actor
    unslop: 29
    # Higher than the others. This one is inherently noisy: an impersonal subject
    # reads as passive to the model even when the sentence is active.
    threshold: 0.80
    instructions: >
      A sentence is built as a form of "be" plus a past participle, with the actor left
      out, and the writer plainly knows who the actor is. Only an actual passive
      construction counts. A sentence whose subject performs the verb is active, however
      impersonal its subject sounds.
    criteria:
      true: >
        The passage contains a be-plus-participle sentence with no "by" phrase, where the
        writer could name the actor. Examples: "the rewrite was completed last quarter",
        "queries are validated", "the decision was made".
      false: >
        There is no such sentence. Sentences with a non-human subject that still performs
        its own verb are active, not passive: "the solver reports them", "the queue drains
        by hand", "retries stop after four attempts", "panel count is not the metric".
    fix: Name the actor and make it the subject.

  synonym_cycling:
    name: synonym cycling
    unslop: 11
    threshold: 0.70
    instructions: >
      One thing is referred to by several different words across nearby sentences, for
      style rather than because the meanings differ. For example the same tool called
      "the agent", then "the assistant", then "the system".
    criteria:
      true: A single referent is renamed across nearby sentences with no change in meaning.
      false: Each term names a distinct thing, or one term is repeated consistently.
    fix: Pick one word and repeat it.

  rhetorical_setup:
    name: rhetorical setup
    unslop: null
    threshold: 0.70
    instructions: >
      A question or teaser is posed for effect and then answered by the writer, or used to
      build suspense. Forms include "what if I told you", "think about it", "plot twist",
      and a question immediately answered in the next sentence.
    criteria:
      true: A question or teaser is posed for effect rather than to be answered by the reader.
      false: >
        Points are made directly. A genuine question left open for the reader is not
        this pattern.
    fix: Drop the setup and make the point.
